<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centered Image</title>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        flex-direction: column;
        font-family: Arial, sans-serif;
    }
    img {
        width: 150px;
        height: 150px;
        margin-bottom: 20px;
    }
    .text {
        font-size: 24px;
        font-weight: bold;
        color: #333;
    }
</style>
</head>
<body>
    <img src="https://raw.githubusercontent.com/h4nt3rx/hunter/site/cbbh.png" alt="Custom bcrypt Hashing">
    <div class="text">h4nt3rx</div>
</body>
</html>
